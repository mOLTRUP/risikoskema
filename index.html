ledning":""},{"emne":"Anvendelse","vejledning":"Tilpas til egne varer. Vurdér farer generelt og særskilt for hver godsart eller supplerende fare. Ved forskellig væsentlighed, kritisk grænse eller CCP/OPRP-styring anvendes særskilt vurdering/bilag eller flere rækker. Markér irrelevante dele med begrundelse."},{"emne":"Procesforløb","vejledning":"Ordre - valg af materiel - rengøring og kontrol - modtagelse - læsning - transport - eventuel omlæsning/oplag - levering. Beskriv eget flow og bekræft det i praksis."},{"emne":"Produktbeskrivelse","vejledning":"Angiv varetyper, emballage, temperaturkrav, allergener, tiltænkt anvendelse og eventuelt sårbare forbrugere. Angiv, om senere behandling forventes at fjerne faren."},{"emne":"Alvorlighed: 1 – lille","vejledning":"Begrænset helbredsmæssig konsekvens. Rene kvalitetsfejl vurderes særskilt. Emballagens beskyttelse påvirker primært sandsynligheden."},{"emne":"Alvorlighed: 2 – middel","vejledning":"Kan medføre sygdom eller skade af moderat omfang. Begrund med den konkrete fare og forbrugergruppe."},{"emne":"Alvorlighed: 3 – stor","vejledning":"Kan medføre alvorlig sygdom, varig skade eller dødsfald. Relevante allergener, toksiner og skarpe fremmedlegemer kan have stor alvorlighed."},{"emne":"Sandsynlighed: 1 – lav","vejledning":"Faren vurderes sjældent at opstå under de forhold, der vurderes. Underbyg med relevante data og erfaringer."},{"emne":"Sandsynlighed: 2 – middel","vejledning":"Faren kan opstå lejlighedsvis under de forhold, der vurderes."},{"emne":"Sandsynlighed: 3 – høj","vejledning":"Faren forekommer ofte eller er forventelig under de forhold, der vurderes."},{"emne":"Før og efter kontrol","vejledning":"Vurder først sandsynligheden uden de beskrevne kontrolforanstaltninger. Vurder derefter restrisikoen med implementerede og dokumenteret effektive kontroller. Alvorligheden er den samme, hvis konsekvensen ved faren er uændret."},{"emne":"Risikoscore","vejledning":"Score = alvorlighed × sandsynlighed (1–3). Lille: 1 / Middel: 2 / Høj: 3. Grænserne er ikke lovbestemte og skal godkendes af virksomheden."},{"emne":"Væsentlig fare / accept","vejledning":"Brug score sammen med faglig vurdering. Stor alvorlighed kræver særskilt begrundelse også ved lav sandsynlighed. En lav score dokumenterer ikke i sig selv, at risikoen er acceptabel."},{"emne":"Valg af styring","vejledning":"GHP (PRP): god hygiejnepraksis. OPRP: operationelt basisprogram. CCP: kritisk kontrolpunkt. System: fx sporbarhed. Begrund valget ud fra faren og kontrollens funktion. Score alene afgør ikke, om noget er et CCP."},{"emne":"Acceptkriterier / kritiske grænser","vejledning":"Angiv konkrete vare- og proceskrav, temperaturgrænser, tolerancer og eventuelle tidsgrænser med kilde. Ved CCP angives valideret kritisk grænse, overvågning og korrigerende handling."},{"emne":"Overvågning","vejledning":"Beskriv hvad der kontrolleres, hvordan, hvor ofte, af hvem og hvor resultatet registreres. Supplér forslagene med virksomhedens konkrete rutiner."},{"emne":"Afvigelser","vejledning":"Beskriv stop, tilbageholdelse, kontakt til kunden, vurdering og frigivelse eller afvisning af gods. Registrér årsag, handling, ansvarlig og opfølgning. Fotos er supplerende dokumentation."},{"emne":"Validering / verifikation","vejledning":"Validering dokumenterer, at kontrolmetoden kan styre faren. Verifikation efterprøver, at den anvendes og virker som planlagt, fx ved registreringsgennemgang, audit, prøver og sporbarhedstest."},{"emne":"Dokumentation af sandsynlighed","vejledning":"Brug afvigelser, reklamationer, rengørings- og temperaturdata, vedligeholdelse og audits. Uddannelse understøtter styringen, men dokumenterer ikke alene lav sandsynlighed."},{"emne":"Revision","vejledning":"Revidér ved ændringer i varer, materiel, processer eller krav samt efter relevante hændelser og ved planlagt gennemgang. Dokumentér godkendelse og revision."}],"handlingsplan":{"kolonner":["Risiko-ID","Afvigelse / behov","Handling","Ansvarlig","Frist","Status","Gen umentation":"Instruktion, afvigelse og opfølgning."}},"source_row":29,"section_id":"section-7","section_name":"3.2. Personale"}],"vejledning":[{"emne":"Felt / emne","vejledning":"Udfyldning / vejledning"},{"emne":"Virksomhed","vejledning":""},{"emne":"Omfang / varer / transportformer","vejledning":""},{"emne":"Analyse udført af / HACCP-team","vejledning":""},{"emne":"Version / dato","vejledning":""},{"emne":"Godkendt af / dato","vejledning":""},{"emne":"Næste revision","vejledning":""},{"emne":"Anvendelse","vejledning":"Tilpas til egne varer. Vurdér farer generelt og særskilt for hver godsart ellersupplerende fare. Ved forskellig væsentlighed, kritisk grænse eller CCP/OPRP-styring anvendes særskilt vurdering/bilag eller flere rækker. Markér irrelevante dele med begrundelse."},{"emne":"Procesforløb","vejledning":"Ordre - valg af materiel - rengøring og kontrol - modtagelse - læsning - transport - eventuel omlæsning/oplag - levering. Beskriv eget flow og bekræft det i praksis."},{"emne":"Produktbeskrivelse","vejledning":"Angiv fodertyper, tør/våd/flydende form, emballage, dyreart, tilsætningsstoffer, animalske bestanddele og særlige krav. Vurdér konsekvenser for både dyr og mennesker via fødevarekæden."},{"emne":"Alvorlighed: 1 – lille","vejledning":"Begrænset helbredsmæssig konsekvens. Rene kvalitetsfejl vurderes særskilt. Emballagens beskyttelse påvirker primært sandsynligheden."},{"emne":"Alvorlighed: 2 – middel","vejledning":"Kan medføre sygdom eller skade af moderat omfang. Begrund med den konkrete fare og dyreart og eventuelle konsekvenser i fødevarekæden."},{"emne":"Alvorlighed: 3 – stor","vejledning":"Kan medføre alvorlig sygdom, varig skade eller dødsfald. Sygdomsfremkaldende mikroorganismer, toksiner, lægemiddelrester og skarpe fremmedlegemer kan have stor alvorlighed."},{"emne":"Sandsynlighed: 1 – lav","vejledning":"Faren vurderes sjældent at opstå under de forhold, der vurderes. Underbyg med relevante data og erfaringer."},{"emne":"Sandsynlighed: 2 – middel","vejledning":"Faren kan opstå lejlighedsvis under de forhold, der vurderes."},{"emne":"Sandsynlighed: 3 – høj","vejledning":"Faren forekommer ofte eller er forventelig under de forhold, der vurderes."},{"emne":"Før og efter kontrol","vejledning":"Vurder først sandsynligheden uden de beskrevne kontrolforanstaltninger. Vurder derefter restrisikoen med implementerede og dokumenteret effektive kontroller. Alvorligheden er den samme, hvis konsekvensen ved faren er uændret."},{"emne":"Risikoscore","vejledning":"Score = alvorlighed × sandsynlighed (1–3). Lille: 1 / Middel: 2 / Høj: 3. Grænserne er ikke lovbestemte og skal godkendes af virksomheden."},{"emne":"Væsentlig fare / accept","vejledning":"Brug score sammen med faglig vurdering. Stor alvorlighed kræver særskilt begrundelse også ved lav sandsynlighed. En lav score dokumenterer ikke i sig selv, at risikoen er acceptabel."},{"emne":"Valg af styring","vejledning":"GHP (PRP): god hygiejnepraksis. OPRP: operationelt basisprogram. CCP: kritisk kontrolpunkt. System: fx sporbarhed. Begrund valget ud fra faren og kontrollens funktion. Score alene afgør ikke, om noget er et CCP."},{"emne":"Acceptkriterier / kritiske grænser","vejledning":"Angiv konkrete vare- og proceskrav, temperaturgrænser, tolerancer og eventuelle tidsgrænser med kilde. Ved CCP angives valideret kritisk grænse, overvågning og korrigerende handling."},{"emne":"Overvågning","vejledning":"Beskriv hvad der kontrolleres, hvordan, hvor ofte, af hvem og hvor resultatet registreres. Supplér forslagene med virksomhedens konkrete rutiner."},{"emne":"Afvigelser","vejledning":"Beskriv stop, tilbageholdelse, kontakt til kunden, vurdering og frigivelse eller afvisning af gods. Registrér årsag, handling, ansvarlig og opfølgning. Fotos er supplerende dokumentation."},{"emne":"Validering / verifikation","vejledning":"Validering dokumenterer, at kontrolmetoden kan styre faren. Verifikation efterprøver, at den anvendes og virker som planlagt, fx ved registreringsgennemgan (() => {
  'use strict';
  const cfg = window.IR_RISK_CONFIG || {};
  const FIELDS = [
    ['farebeskrivelse','Farebeskrivelse'],
    ['forebyggende','Forebyggende foranstaltninger'],
    ['ansvarlig_forebyggelse','Ansvarlig'],
    ['dokumentation','Dokumentation'],
    ['overvaagning','Overvågning'],
    ['frekvens','Frekvens'],
    ['korrigerende','Korrigerende handling'],

    ['kontroldokumentation','Dokumentation for kontrol'],
  ];
  const PLAN_COLS = ['Risiko-ID','Afvigelse / behov','Handling','Ansvarlig','Frist','Status','Gennemført dato','Verifikation / effekt','Godkendt af'];
  const MATRIX = [[1,1,2],[1,2,3],[2,3,3]];
  const LEVELS = ['Lille','Middel','Høj'];

  const DEFAULT_RISK_CATEGORIES=['LILLE','VÆSENTLIG','HØJ'];

  // Numeriske afsnitspræfikser er kun visning: overskrifternes egne navne gemmes uden tal.
  const cleanSectionName = value => String(value||'').replace(/^\s*\d+(?:\.\d+)*\.?\s+/, '').trim();
  const sectionOutline = rows => {
    const outline=new Map(),counts=[0,0,0,0];let previous=0;
    for(const row of rows){
      if(outline.has(row.section_id))continue;
      let depth=Math.max(0,Math.min(3,Number(row.section_level)||0));
      depth=Math.min(depth,outline.size ? previous+1 : 0);
      counts[depth]++;
      for(let j=depth+1;j<counts.length;j++)counts[j]=0;
      const number=counts.slice(0,depth+1).join('.');
      outline.set(row.section_id,{number,depth,name:cleanSectionName(row.section_name)});
      previous=depth;
    }
    return outline;
  };
  const LEGEND = {green:'1: LILLE', yellow:'2: VÆSENTLIG', red:'3: HØJ'};
  const CONTROL = {green:'1: PRP OG GMP',yellow:'2: OPRP',red:'3: CCP'};
  // Afsnitsoverskrifterne i Excel ligger som tegnede tekstbokse over arket.
  // De er derfor indlæst særskilt og placeres før den første risikopost i hvert afsnit.
  const SOURCE_SECTIONS = {
    foedevarer: [[10,'1. Ordremodtagelse'],[13,'2.2. Disponering'],[15,'2.3. Temperaturregulering'],[18,'2.4. Læsning, transport og losning'],[23,'2.5. Rengøring'],[25,'3.1. Materiel'],[27,'3.2. Personale']],
    foder: [[10,'1. Ordremodtagelse'],[13,'2.2. Disponering'],[17,'2.3. Temperaturregulering'],[19,'2.4. Læsning, transport og losning'],[25,'2.5. Rengøring'],[27,'3.1. Materiel'],[29,'3.2. Personale']]
  };
  const builtinSection = (slug,sourceRow) => {
    const entries = SOURCE_SECTIONS[slug] || [];
    let last = null;
    for (let i=0;i<entries.length;i++) if (sourceRow>=entries[i][0]) last={id:'section-'+(i+1),name:entries[i][1]};
    return last;
  };
  const esc = text => String(text ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = prefix => prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
  const defaultVariants = () => Object.fromEntries(['green','yellow','red'].map(c=>[c,Object.fromEntries(FIELDS.map(([k])=>[k,'']))]));
  const blankRow = (areaId,areaName='',sectionId='section-main',sectionName='Nyt afsnit') => ({id:uid('risk'),area_id:areaId,area_name:areaName,section_id:sectionId,section_name:sectionName,question:'',sandsynlighed:'Lille',alvor:'Middel',variants:defaultVariants()});
  const emptyData = () => {const id=uid('area');return {title:'Nyt risikoskema',description:'',company:'',date:new Date().toISOString().slice(0,10),hazards:['Biologisk','Fysisk','Kemisk','Allergener'],riskCategories:[...DEFAULT_RISK_CATEGORIES],controlMeasures:[...DEFAULT_CONTROLS],rows:[blankRow(id,'Nyt risiko-område','section-main','Nyt afsnit')],vejledning:[{emne:'Anvendelse',vejledning:''},{emne:'Sandsynlighed',vejledning:'Lille / Middel / Høj'},{emne:'Alvor',vejledning:'Lille / Middel / Høj'}],handlingsplan:{kolonner:[...PLAN_COLS],rows:[]},meta:{omfang:'',haccp_team:'',version:'1',godkendt_af:'',naeste_revision:''}};};
  const riskLevel = row => { const a=Math.max(0,LEVELS.indexOf(row.sandsynlighed)); const b=Math.max(0,LEVELS.indexOf(row.alvor)); return COLOR[MATRIX[a][b]]; };
  const riskScore = row => MATRIX[Math.max(0,LEVELS.indexOf(row.sandsynlighed))][Math.max(0,LEVELS.indexOf(row.alvor))];
  const ensureData = data => {
    const d=structuredClone(data);
    d.rows = Array.isArray(d.rows)?d.rows:[];
    const slug = d.slug || (String(d.source_file||'').startsWith('10338')?'foedevarer':String(d.source_file||'').startsWith('10134')?'foder':String(d.print_title||'').includes('FØDEVARER')?'foedevarer':String(d.print_title||'').includes('FODER')?'foder':'');
    d.rows.forEach(r=>{r.id ||= uid('risk');r.area_id ||= uid('area');
       // Opgrader allerede gemte v0.1-skemaer uden at ændre spørgsmål eller brugerens tekster.
       if(!r.section_id){const legacyRow = /^risk-(\d+)$/.exec(r.id||'');const sourceRow=Number(r.source_row)|| (legacyRow?Number(legacyRow[1]):0);
         const imported=sourceRow?builtinSection(slug,sourceRow):null;
         r.section_id=imported?.id || 'section-main';r.section_name=imported?.name || 'Risikoområder';}
       r.section_name = cleanSectionName(r.section_name || 'Risikoområder');r.section_level = Math.max(0,Math.min(3,Number(r.section_level)||0));r.variants ||= defaultVariants();['green','yellow','red'].forEach(level=>{r.variants[level] ||= {};FIELDS.forEach(([k])=>{r.variants[level][k] ||= '';});});
       r.sandsynlighed = r.sandsynlighed==='Stor'?'Høj':(LEVELS.includes(r.sandsynlighed)?r.sandsynlighed:'Lille');

    });
    d.meta ||= {};d.handlingsplan ||= {kolonner:[...PLAN_COLS],rows:[]};d.handlingsplan.kolonner ||= [...PLAN_COLS];d.handlingsplan.rows ||= [];d.vejledning ||= [];d.hazards ||= [];d.riskCategories = Array.from({length:3},(_,i)=>String(d.riskCategories?.[i]??DEFAULT_RISK_CATEGORIES[i]));d.controlMeasures=Array.from({length:3},(_,i)=>String(d.controlMeasures?.[i]??DEFAULT_CONTROLS[i]));
    return d;
  };
  const demoMemory = {};
  const initialDemo = () => {
    const templates = Object.entries(cfg.demoData || {}).map(([id,v])=>({id:'sample:'+id,title:v.title,builtin:true}));

    return {templates:[...templates,...Object.entries(storage).filter(([k])=>k.startsWith('template:')).map(([id,v])=>({id,title:v.title,builtin:false}))],cases:Object.entries(storage).filter(([k])=>k.startsWith('case:')).map(([id,v])=>({id,title:v.title,modified:v.lastEdited||''})),storage};
  };
  const api = async (action,params={}) => {
    if(cfg.demo) {
      const sim=initialDemo();
      if(action==='ir_list') return {templates:sim.templates,cases:sim.cases};
      if(action==='ir_get') { const slug=(params.id||'').replace(/^sample:/,'');const item=(params.id||'').startsWith('sample:')?cfg.demoData[slug]:sim.storage[params.id];if(!item)throw new Error('Skemaet findes ikke.');return {item:structuredClone(item),id:params.id}; }
      if(action==='ir_save') {const id=(params.id||'').startsWith(params.kind+':')?params.id:params.kind+':'+uid('doc');const item=JSON.parse(params.payload);item.lastEdited=new Date().toLocaleString('da-DK');sim.storage[id]=item;Object.assign(demoMemory,sim.storage);try{localStorage.setItem('ir_risk_demo_storage',JSON.stringify(sim.storage));}catch(_){}return {id,title:item.title};}
      if(action==='ir_delete'){delete sim.storage[params.id];delete demoMemory[params.id];try{localStorage.setItem('ir_risk_demo_storage',JSON.stringify(sim.storage));}catch(_){}return {deleted:params.id};}
    }
    const form=new FormData();form.set('action',action);form.set('nonce',cfg.nonce||'');Object.entries(params).forEach(([key,value])=>form.set(key,value));
    const result=await fetch(cfg.ajax,{method:'POST',body:form,credentials:'same-origin'});

  };
  class RiskApp {
    constructor(root){this.root=root;this.doc=null;this.source=null;this.currentTab='risk';this.lastSavedId=null;this.cards={templates:[],cases:[]};this.busy=false;this.mode='assessment';this.templateTitle='';this.assessmentTitle='';this.bindActions();this.loadList();}
    notify(msg,failed=false){const n=this.root.querySelector('.ir-notify');if(n){n.textContent=msg;n.className='ir-notify ir-no-print '+(failed?'ir-error':'ir-ok');}else alert(msg);}
    async loadList(){try{this.cards=await api('ir_list');this.renderHome();}catch(e){this.root.innerHTML='<p class="ir-error">'+esc(e.message)+'</p>';}}
    renderHome(){this.doc=null;this.source=null;
      const templates=this.cards.templates.map(c=>`<button class="ir-card" data-action="open" data-id="${esc(c.id)}"><span class="ir-card-icon">▤</span><strong>${esc(c.title)}</strong><small>${c.builtin?'Standardskabelon':'Egen skabelon'}</small></button>`).join('');
      const cases=this.cards.cases.map(c=>`<button class="ir-case-row" data-action="open" data-id="${esc(c.id)}"><strong>${esc(c.title)}</strong>${c.modified?`<small>${esc(c.modified)}</small>`:''}</button>`).join('');
      this.root.innerHTML=`<div class="ir-shell"><header class="ir-top"><div><h2>Risikoskemaer</h2><p>Vælg en skabelon, udfyld og udskriv på A4 liggende</p></div></header><p class="ir-notify" role="status" aria-live="polite"></p><div class="ir-home-grid"><section class="ir-home-templates"><div class="ir-home-heading"><h3>Standardskabeloner</h3></div><div class="ir-home-controls"><button class="ir-btn ir-primary ir-home-new" data-action="new">+ Opret ny skabelon</button></div><div class="ir-cards">${templates}</div></section><section class="ir-home-cases"><div class="ir-home-heading"><h3>Udarbejdede risikovurderinger</h3></div><div class="ir-case-list">${cases||'<p class="ir-home-empty">Ingen udarbejdede risikovurderinger endnu.</p>'}</div></section></div></div>`;
    }
    async open(id){try{const data=await api('ir_get',{id});this.doc=ensureData(data.item);this.templateTitle=this.doc.title||'';this.mode='assessment';this.assessmentTitle=id.startsWith('case:')?this.doc.title:'';if(!id.startsWith('case:'))this.doc.title='';if(id.startsWith('sample:')&&!this.doc.date)this.doc.date=new Date().toISOString().slice(0,10);this.source=id;this.currentTab='risk';this.renderEditor();}catch(e){this.notify(e.message,true);}}
    newDoc(){this.doc=emptyData();this.source=null;this.mode='template';this.templateTitle='';this.assessmentTitle='';this.currentTab='risk';this.renderEditor();}
    tabButton(name,title){return `<button data-action="tab" data-tab="${name}" class="ir-tab ${this.currentTab===name?'active':''}">${title}</button>`;}
    renderEditor(){const d=this.doc;if(!d)return;this.root.innerHTML=`<div class="ir-shell ir-editing"><div class="ir-toolbar ir-no-print"><button class="ir-btn" data-action="home">← Oversigt</button></div><p class="ir-notify ir-no-print" role="status" aria-live="polite"></p><div class="ir-toolbar ir-no-print ir-tabs ir-editor-tabs"><div class="ir-tab-list">${this.tabButton('risk','Risikovurdering')}${this.tabButton('guidance','Vejledning')}${this.tabButton('plan','Handlingsplan')}${this.tabButton('background','Baggrund')}</div><div class="ir-mode-switch ${this.mode==='assessment'?'is-assessment':'is-template'}" role="group" aria-label="Vælg arbejdstilstand"><button class="ir-btn ir-mode-btn ${this.mode==='template'?'is-active':''}" aria-pressed="${this.mode==='template'}" data-action="mode-template">Edit nuværende skabelon</button><button class="ir-btn ir-mode-btn ${this.mode==='assessment'?'is-active':''}" aria-pressed="${this.mode==='assessment'}" data-action="mode-assessment">Udarbejd en risikovurdering</button></div></div><div class="ir-print-book"><section class="ir-pane ir-risk-pane ${this.currentTab==='risk'?'active':''}" data-pane="risk">${this.riskHTML()}</section><section class="ir-pane ir-guide-pane ${this.currentTab==='guidance'?'active':''}" data-pane="guidance">${this.guideHTML()}</section><section class="ir-pane ir-plan-pane ${this.currentTab==='plan'?'active':''}" data-pane="plan">${this.planHTML()}</section><section class="ir-pane ir-background-pane ${this.currentTab==='background'?'active':''}" data-pane="background">${this.backgroundHTML()}</section></div><div class="ir-publish-actions ir-no-print">${this.mode==='assessment'?'<button class="ir-btn ir-publish-btn" data-action="publish-pdf">Udgiv risikovurdering - PDF</button><button class="ir-btn ir-publish-btn" data-action="publish-print">Udgiv risikovurdering - Udskrift</button>':'<button class="ir-btn ir-publish-btn" data-action="save-template">Gem ændringer i skabelon</button>'}</div><dialog class="ir-variant-dialog ir-no-print"></dialog></div>`;
       this.bindActions();this.resizeTextareas();
    }
    legendHTML(kind,index,value,prefix=''){
      if(this.mode!=='template')return `<span>${esc(prefix+value)}</span>`;
      return `<span class="ir-legend-row"><button type="button" class="ir-legend-click ir-no-print" data-action="edit-legend" data-kind="${kind}" data-index="${index}" aria-label="Rediger ${esc(value)}">${esc(prefix+value)}</button><input class="ir-legend-input ir-no-print" data-legend-kind="${kind}" data-legend-index="${index}" value="${esc(value)}" aria-label="Rediger ${esc(value)}" hidden><span class="ir-legend-print">${esc(prefix+value)}</span></span>`;
    }
    riskHTML(){const d=this.doc;let previousArea=null;let previousSection=null;let body='';const outlines=sectionOutline(d.rows);
      const tableText=(value,editor)=>`${this.mode==='template'?editor:`<div class="ir-readonly-value">${esc(value||'')}</div>`}<div class="ir-print-value">${esc(value||'')}</div>`;
      d.rows.forEach((r,index)=>{const level=riskLevel(r);const score=riskScore(r);
        if(r.section_id!==previousSection){previousSection=r.section_id;
          const section=outlines.get(r.section_id),sectionTitle=`${section.number}. ${section.name}`;
          const sectionEdit=this.mode==='template'?`<input class="ir-section-editor-input ir-no-print" data-section-id="${esc(r.section_id)}" value="${esc(section.name)}" aria-label="Navn på afsnit ${esc(section.number)}" style="margin-left:${section.depth*17}px">`:'';
          const tools=this.mode==='template'?`<div class="ir-section-actions ir-no-print"><button type="button" class="ir-btn" data-action="section-outdent" data-section="${esc(r.section_id)}">Niveau ud</button><button type="button" class="ir-btn" data-action="section-indent" data-section="${esc(r.section_id)}">Niveau ind</button><button type="button" class="ir-btn" data-action="section-add-area" data-section="${esc(r.section_id)}">Nyt risiko område</button><button type="button" class="ir-btn" data-action="section-add-before" data-section="${esc(r.section_id)}">Nyt afsnit</button></div>`:'';
          body+=`<tr class="ir-section-row" data-section="${esc(r.section_id)}"><th colspan="14"><div class="ir-section-heading"><span class="ir-section-editor-number" style="margin-left:${section.depth*17}px">${esc(section.number)}.</span>${sectionEdit}<span class="ir-section-text ${this.mode==='template'?'ir-section-print-only':''}" data-section-label="${esc(r.section_id)}">${esc(section.name)}</span>${tools}</div></th></tr>`;
        }
        const firstArea=r.area_id!==previousArea;previousArea=r.area_id;
        const area = firstArea ? tableText(r.area_name,`<textarea class="ir-cell-text" data-row="${index}" data-prop="area_name" aria-label="Risiko-område">${esc(r.area_name)}</textarea>`) : `<span class="ir-continuation" title="Samme risiko-område som ovenfor">↳</span>`;
        const selection = field => `<div class="ir-levels ir-no-print" role="group" aria-label="${field==='alvor'?'Alvor':'Sandsynlighed'}">${LEVELS.map(l=>`<button class="ir-option ${r[field]===l?'selected':''}" data-action="level" data-row="${index}" data-field="${field}" data-value="${l}" aria-pressed="${r[field]===l}">${l}</button>`).join('')}</div><span class="ir-print-choice">${esc(r[field])}</span>`;
        body+=`<tr data-risk-row="${index}"><td>${area}</td><td>${tableText(r.question,`<textarea class="ir-cell-text" data-row="${index}" data-prop="question" aria-label="Spørgsmål eller risikofaktor">${esc(r.question)}</textarea>`)}<small class="ir-id ir-print-only">${esc(r.id)}</small></td><td class="ir-level-td">${selection('sandsynlighed')}</td><td class="ir-level-td">${selection('alvor')}</td><td class="ir-result ir-${level}"><strong>${score}</strong><span data-risk-category-score="${score}">${esc(d.riskCategories[score-1])}</span></td>${FIELDS.map(([key,label])=>`<td>${tableText(r.variants?.[level]?.[key]||'',`<textarea class="ir-cell-text" data-row="${index}" data-variant="${level}" data-field="${key}" aria-label="${esc(label)}">${esc(r.variants?.[level]?.[key]||'')}</textarea>`)}</td>`).join('')}</tr>`;
      });
      return `<div class="ir-sheet"><div class="ir-paper-head"><div class="ir-paper-heading">${this.mode==='template'?`<h2>Editor for følgende:</h2><div class="ir-no-print ir-title-input"><input data-root="title" aria-label="Navn på den aktuelle skabelon" value="${esc(d.title||'')}"></div>`:`<h2>${esc(d.print_title||d.title||'HACCP RISIKOVURDERING')}</h2><div class="ir-no-print ir-title-input"><label>Risikovurdering:<input data-root="title" placeholder="Risikoskemaet navn og evt. område" value="${esc(d.title||'')}"></label></div><div class="ir-paper-meta"><label>VIRKSOMHED: <input data-root="company" value="${esc(d.company||'')}"><span class="ir-print-value">${esc(d.company||'')}</span></label><label>DATO: <input data-root="date" type="date" value="${esc(d.date||'')}"><span class="ir-print-value">${esc(d.date||'')}</span></label></div>`}</div><div class="ir-head-legends"><div><b>TYPE AF RISIKO</b>${(d.hazards||[]).map((value,i)=>this.legendHTML('hazard',i,value)).join('')}</div><div><b>KATEGORI AF RISIKO</b>${d.riskCategories.map((value,i)=>this.legendHTML('risk-category',i,value,`${i+1}: `)).join('')}</div><div><b>KONTROLFORANSTALTNING</b>${d.controlMeasures.map((value,i)=>this.legendHTML('control',i,value,`${i+1}: `)).join('')}</div></div></div><div class="ir-table-scroll"><table class="ir-risk-table"><colgroup>${[13,12,6.6,6.3,6,17,19,8,11,11,7,13,8,10].map(w=>`<col style="width:${w}%">`).join('')}</colgroup><thead><tr class="ir-group-head"><th colspan="12">Forebyggelse af risici</th><th colspan="2">Korrigering af risici</th></tr><tr>${['Procestrin','Risikofaktor','Sandsynlighed','Alvor','Kategori af risiko',...FIELDS.map(x=>x[1])].map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></div>`;
    }
    guideHTML(){const d=this.doc;const labels=[['omfang','Omfang / varer / transportformer'],['haccp_team','Analyse udført af / HACCP-team'],['version','Version / dato'],['godkendt_af','Godkendt af / dato'],['naeste_revision','Næste revision']];return `<div class="ir-sheet"><h2>Vejledning og virksomhedsoplysninger</h2><div class="ir-form-grid">${labels.map(([k,v])=>`<label>${esc(v)}<textarea data-meta="${k}">${esc(d.meta?.[k]||'')}</textarea><div class="ir-print-value">${esc(d.meta?.[k]||'')}</div></label>`).join('')}</div><table class="ir-secondary-table"><thead><tr><th>Felt / emne</th><th>Udfyldning / vejledning</th></tr></thead><tbody>${d.vejledning.map((g,i)=>`<tr><td><textarea data-guide="${i}" data-guide-field="emne">${esc(g.emne)}</textarea><div class="ir-print-value">${esc(g.emne)}</div></td><td><textarea data-guide="${i}" data-guide-field="vejledning">${esc(g.vejledning)}</textarea><div class="ir-print-value">${esc(g.vejledning)}</div></td></tr>`).join('')}</tbody></table><div class="ir-no-print ir-sheet-bottom"><button data-action="add-guidance" class="ir-btn">+ Tilføj vejledning</button></div></div>`;}
    planHTML(){const d=this.doc;const cols=d.handlingsplan.kolonner?.length===9?d.handlingsplan.kolonner:PLAN_COLS;return `<div class="ir-sheet"><h2>Handlingsplan og opfølgning</h2><p>TRANSPORT – OPLAG</p><p>Angiv risiko-ID, så handlingen kan knyttes til den konkrete fare. Risiko-ID'er vises i redigeringsvisningen.</p><div class="ir-table-scroll"><table class="ir-secondary-table ir-plan-table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th class="ir-no-print">Handling</th></tr></thead><tbody>${d.handlingsplan.rows.map((r,i)=>`<tr>${Array.from({length:9},(_,k)=>`<td><textarea data-plan="${i}" data-plan-col="${k}" aria-label="${esc(cols[k])}">${esc(r[k]||'')}</textarea><div class="ir-print-value">${esc(r[k]||'')}</div></td>`).join('')}<td class="ir-no-print"><button data-action="delete-plan" data-index="${i}">Slet</button></td></tr>`).join('')}</tbody></table></div><div class="ir-no-print ir-sheet-bottom"><button class="ir-btn" data-action="add-plan">+ Tilføj handling</button></div></div>`;}
    backgroundHTML(){const d=this.doc;return `<div class="ir-sheet"><h2>Baggrund – vurderingsgrundlag</h2><p>Sandsynlighed og alvor vurderes på tre trin. Farvekategorien beregnes efter nedenstående risikomatrix.</p><table class="ir-secondary-table ir-matrix-table"><thead><tr><th>Sandsynlighed / Alvor</th>${LEVELS.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${LEVELS.map((name,i)=>`<tr><th>${name}</th>${MATRIX[i].map(n=>`<td class="ir-result ir-${COLOR[n]}">${n}: ${esc(d.riskCategories[n-1])}</td>`).join('')}</tr>`).join('')}</tbody></table><h3>Kontrolforanstaltninger</h3><p>Grøn: ${esc(d.controlMeasures[0])} · Gul: ${esc(d.controlMeasures[1])} · Rød: ${esc(d.controlMeasures[2])}. Den konkrete faglige vurdering og eventuelle kritiske kontrolpunkter skal altid begrundes.</p><p>Baggrundsfanen i de oprindelige Excel-filer indeholder desuden valgene Ja/Nej og Lille/Middel/Stor. I dette system betegnes sidste risikotrin konsekvent <strong>Høj</strong>.</p></div>`;}
    resizeTextareas(){this.root.querySelectorAll('textarea').forEach(x=>{x.style.height='auto';x.style.height=Math.max(32,x.scrollHeight+3)+'px';});}
    setSectionDepth(sectionId,delta){
      const outlines=sectionOutline(this.doc.rows),item=outlines.get(sectionId);
      if(!item)return;
      const keys=[...outlines.keys()],index=keys.indexOf(sectionId);
      const previous=index>0?outlines.get(keys[index-1]):null;
      const next=Math.max(0,Math.min(3,item.depth+delta));
      const depth=Math.min(next,index>0?previous.depth+1:0);
      this.doc.rows.filter(row=>row.section_id===sectionId).forEach(row=>row.section_level=depth);
      this.renderEditor();
    }
    insertSectionBefore(sectionId){
      const index=this.doc.rows.findIndex(row=>row.section_id===sectionId);
      if(index<0)return;
      const old=this.doc.rows[index],newId=uid('section');
      const row=blankRow(uid('area'),'Nyt risiko-område',newId,'Nyt afsnit');
      row.section_level=Number(old.section_level)||0;
      this.doc.rows.splice(index,0,row);this.renderEditor();
    }
    insertAreaUnder(sectionId){
      const all=this.doc.rows.map((row,i)=>row.section_id===sectionId?i:-1).filter(i=>i>=0);
      if(!all.length)return;
      const last=this.doc.rows[all[all.length-1]];
      const row=blankRow(uid('area'),'Nyt risiko-område',sectionId,last.section_name);
      row.section_level=last.section_level;
      this.doc.rows.splice(all[all.length-1]+1,0,row);this.renderEditor();
    }
    bindActions(){if(this.bound)return;this.bound=true;
      this.root.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;e.preventDefault();this.handleAction(target);});
      this.root.addEventListener('focusout',e=>{const input=e.target;if(input.matches?.('[data-legend-kind]')){input.hidden=true;const button=input.parentElement.querySelector('.ir-legend-click');button.hidden=false;this.renderEditor();}});
      this.root.addEventListener('input',e=>{if(!this.doc)return;const t=e.target;
        if(this.mode==='assessment'&&(t.hasAttribute('data-row')||t.hasAttribute('data-section-id')||t.hasAttribute('data-variant-editor-row')))return;
        if(t.hasAttribute('data-legend-kind')){
          if(this.mode!=='template')return;
          const kind=t.dataset.legendKind,i=Number(t.dataset.legendIndex);
          const arr=kind==='hazard'?this.doc.hazards:kind==='risk-category'?this.doc.riskCategories:this.doc.controlMeasures;
          if(!arr||!Number.isInteger(i)||i<0||i>=arr.length)return;
          arr[i]=t.value;
          if(kind==='risk-category')this.root.querySelectorAll(`[data-risk-category-score="${i+1}"]`).forEach(el=>el.textContent=t.value);
          const printed=t.parentElement.querySelector('.ir-legend-print');if(printed)printed.textContent=(kind==='hazard'?'':`${i+1}: `)+t.value;
          return;
        }
        let changed=false;
        if(t.hasAttribute('data-root')){this.doc[t.dataset.root]=t.value;changed=true;}
        if(t.hasAttribute('data-section-id')){const sectionId=t.dataset.sectionId;this.doc.rows.filter(row=>row.section_id===sectionId).forEach(row=>row.section_name=t.value);
          this.root.querySelectorAll('[data-section-label]').forEach(el=>{if(el.dataset.sectionLabel===sectionId)el.textContent=cleanSectionName(t.value);});changed=true;}
        if(t.hasAttribute('data-row')){const r=this.doc.rows[+t.dataset.row];if(r){if(t.dataset.prop){r[t.dataset.prop]=t.value;if(t.dataset.prop==='area_name'){this.doc.rows.filter(row=>row.area_id===r.area_id).forEach(row=>row.area_name=t.value);}}else if(t.dataset.variant&&t.dataset.field){r.variants[t.dataset.variant][t.dataset.field]=t.value;}changed=true;}}
        if(t.hasAttribute('data-variant-editor-row')){const row=this.doc.rows[+t.dataset.variantEditorRow];row.variants[t.dataset.variantEditorColor][t.dataset.variantEditorField]=t.value;changed=true;}
        if(t.hasAttribute('data-meta')){this.doc.meta[t.dataset.meta]=t.value;changed=true;}
        if(t.hasAttribute('data-guide')){this.doc.vejledning[+t.dataset.guide][t.dataset.guideField]=t.value;changed=true;}
        if(t.hasAttribute('data-plan')){this.doc.handlingsplan.rows[+t.dataset.plan][+t.dataset.planCol]=t.value;changed=true;}
        if(changed){const cell=t.closest('td, label');const printValue=cell?.querySelector('.ir-print-value');if(printValue)printValue.textContent=t.value;if(t.tagName==='TEXTAREA'){t.style.height='auto';t.style.height=Math.max(32,t.scrollHeight+3)+'px';}}
      });
    }
    async handleAction(el){const a=el.dataset.action;if(a==='home'){return this.loadList();}if(a==='new')return this.newDoc();if(a==='open')return this.open(el.dataset.id);if(!this.doc)return;
      if(a==='tab'){this.currentTab=el.dataset.tab;this.root.querySelectorAll('.ir-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===this.currentTab));this.root.querySelectorAll('.ir-pane').forEach(p=>p.classList.toggle('active',p.dataset.pane===this.currentTab));return;}
      if(a==='mode-template'){if(this.mode!=='template'){this.assessmentTitle=this.doc.title;this.doc.title=this.templateTitle;this.mode='template';this.renderEditor();}return;}
      if(a==='mode-assessment'){if(this.mode!=='assessment'){this.templateTitle=this.doc.title;this.doc.title=this.assessmentTitle;this.mode='assessment';this.renderEditor();}return;}
      if(a==='publish-print')return this.publish('print');
      if(a==='publish-pdf')return this.publish('pdf');
      if(a==='print'){window.print();return;}
      if(a==='save'||a==='save-template')return this.save(a==='save-template'?'template':'case');
      if(a==='edit-legend'&&this.mode==='template'){
        const input=el.parentElement.querySelector('[data-legend-kind]');
        if(input){el.hidden=true;input.hidden=false;input.focus();input.select();}return;
      }
      if(this.mode==='template'&&a==='section-outdent')return this.setSectionDepth(el.dataset.section,-1);
      if(this.mode==='template'&&a==='section-indent')return this.setSectionDepth(el.dataset.section,1);
      if(this.mode==='template'&&a==='section-add-area')return this.insertAreaUnder(el.dataset.section);
      if(this.mode==='template'&&a==='section-add-before')return this.insertSectionBefore(el.dataset.section);
      if(a==='level'){const r=this.doc.rows[+el.dataset.row];r[el.dataset.field]=el.dataset.value;this.renderEditor();return;}
      if(this.mode!=='template'&& !['level','tab','publish-print','publish-pdf'].includes(a))return;
      const index=Number(el.dataset.index);
      if(a==='variant-edit'){this.openVariantEditor(index,riskLevel(this.doc.rows[index]));return;}
      if(a==='variant-switch'){this.openVariantEditor(+el.dataset.index,el.dataset.color);return;}
      if(a==='variant-close'){this.root.querySelector('.ir-variant-dialog')?.close();this.renderEditor();return;}
      if(a==='add-plan-for'){this.doc.handlingsplan.rows.push([this.doc.rows[index].id,...Array(8).fill('')]);this.currentTab='plan';this.renderEditor();return;}
      if(a==='add-area'){const id=uid('area');const last=this.doc.rows[this.doc.rows.length-1];this.doc.rows.push(blankRow(id,'Nyt risiko-område',last?.section_id||'section-main',last?.section_name||'Nyt afsnit'));this.currentTab='risk';this.renderEditor();return;}
      if(a==='add-section'){const id=uid('section');this.doc.rows.push(blankRow(uid('area'),'Nyt risiko-område',id,'Nyt afsnit'));this.currentTab='risk';this.renderEditor();return;}
      if(a==='add-question'){const r=this.doc.rows[index];this.doc.rows.splice(index+1,0,blankRow(r.area_id,r.area_name,r.section_id,r.section_name));this.renderEditor();return;}
      if(a==='duplicate'){const r=structuredClone(this.doc.rows[index]);r.id=uid('risk');this.doc.rows.splice(index+1,0,r);this.renderEditor();return;}
      if(a==='delete-row'){if(this.doc.rows.length===1){this.notify('Mindst ét spørgsmål skal blive i skemaet.',true);return;}if(!confirm('Slet dette spørgsmål?'))return;this.doc.rows.splice(index,1);this.renderEditor();return;}
      if(a==='up'||a==='down'){const j=index+(a==='up'?-1:1);if(j<0||j>=this.doc.rows.length)return;
        if(this.doc.rows[index].section_id!==this.doc.rows[j].section_id){this.notify('Spørgsmål kan flyttes inden for samme afsnit.');return;}
        [this.doc.rows[index],this.doc.rows[j]]=[this.doc.rows[j],this.doc.rows[index]];this.renderEditor();return;}
      if(a==='add-guidance'){this.doc.vejledning.push({emne:'Nyt emne',vejledning:''});this.renderEditor();return;}
      if(a==='add-plan'){this.doc.handlingsplan.rows.push(Array(9).fill(''));this.renderEditor();return;}
      if(a==='delete-plan'){if(confirm('Slet denne handling?')){this.doc.handlingsplan.rows.splice(index,1);this.renderEditor();}return;}
    }
    openVariantEditor(index,color){const r=this.doc.rows[index];const modal=this.root.querySelector('.ir-variant-dialog');if(!modal)return;modal.innerHTML=`<div class="ir-dialog-head"><div><h3>Tekster efter risikoniveau</h3><p>Risiko ${index+1}: ${esc(r.question||r.area_name)}. Hvert niveau har egne gemte tekster.</p></div><button class="ir-btn" data-action="variant-close">Luk ×</button></div><div class="ir-color-tabs">${['green','yellow','red'].map(c=>`<button class="ir-color-tab ir-${c} ${color===c?'active':''}" data-action="variant-switch" data-index="${index}" data-color="${c}">${LEGEND[c]}</button>`).join('')}</div><div class="ir-variant-fields">${FIELDS.map(([k,label])=>`<label><b>${label}</b><textarea data-variant-editor-row="${index}" data-variant-editor-color="${color}" data-variant-editor-field="${k}">${esc(r.variants[color][k]||'')}</textarea></label>`).join('')}</div><p class="ir-dialog-help">Tekster for andre farver ændres ikke. De eksisterende Excel-tekster er bevaret som udgangspunkt.</p>`;if(!modal.open)modal.showModal();this.resizeTextareas();}
    suggestedTitle(){
      const stamp=this.doc.date||new Date().toISOString().slice(0,10);
      return `Risikovurdering – ${(this.templateTitle||this.doc.print_title||'HACCP').replace(/^HACCP\s*[–-]\s*/i,'')} – ${stamp}`;
    }
    async save(kind){if(this.busy)return false;this.busy=true;try{
       const keepTitle=this.doc.title;
       if(kind==='case'&&!this.doc.title.trim())this.doc.title=this.suggestedTitle();
       if(kind==='template'&&!this.doc.title.trim()){this.notify('Angiv skabelonens navn før du gemmer.',true);this.doc.title=keepTitle;return false;}
       const id=kind==='case'&&this.source?.startsWith('case:')?this.source:kind==='template'&&this.source?.startsWith('template:')?this.source:'';
       const result=await api('ir_save',{kind,id,payload:JSON.stringify(this.doc)});
       if(kind==='case'){this.source=result.id;this.assessmentTitle=this.doc.title;}
       if(kind==='template'){this.source=result.id;this.templateTitle=this.doc.title;}
       this.lastSavedId=result.id;
       this.notify(kind==='template'?'Skabelonen er gemt.':'Risikovurderingen er gemt.');return true;
     }catch(e){this.notify(e.message,true);return false;}finally{this.busy=false;}}
    async publish(kind){
      if(this.busy)return;
      // Gem en særskilt udarbejdet risikovurdering før udgivelse; standarden overskrives aldrig.
      const saved=await this.save('case');if(!saved)return;
      if(kind==='print'){window.print();return;}
      try{await this.exportPDF();this.notify('PDF-download er startet, og risikovurderingen er gemt under Udarbejdede risikovurderinger.');}
      catch(e){this.notify('Risikovurderingen er gemt, men PDF kunne ikke hentes: '+e.message+'. Brug Udskrift og vælg Gem som PDF.',true);}
    }
    async loadPDFLibrary(){
      if(window.html2pdf)return;
      const sources=['https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js','https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'];
      for(const src of sources){
        try{await new Promise((resolve,reject)=>{
          const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error('PDF-biblioteket kunne ikke indlæses'));document.head.appendChild(script);
        });}catch(_){}
        if(window.html2pdf)return;
      }
      throw new Error('PDF-biblioteket kunne ikke indlæses');
    }
    async exportPDF(){
      await this.loadPDFLibrary();
      // En separat printkopi sikrer, at felter og alle fire faner kommer med.
      const book=this.root.querySelector('.ir-print-book');
      const stage=document.createElement('div');stage.className='ir-pdf-source';
      stage.appendChild(book.cloneNode(true));
      stage.querySelectorAll('.ir-no-print,button,textarea,input,dialog').forEach(node=>node.remove());
      const base=(this.doc.title||'Risikovurdering').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9æøåÆØÅ -]/g,'').trim().replace(/\s+/g,'_').slice(0,75)||'Risikovurdering';
      const filename=`${base}.pdf`;
      await window.html2pdf().set({margin:[6,6,6,6],filename,html2canvas:{scale:1.8,backgroundColor:'#ffffff',useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},pagebreak:{mode:['css','legacy'],before:'.ir-pane:not(:first-child)'}}).from(stage).save();
    }

  }
  document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-ir-risk]').forEach(root=>new RiskApp(root));});
})();
</script></body></html>
